services:
  mongo:
    image: mongo:7.0
    container_name: bank-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { if (rs.status().myState !== 1) quit(1); } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }); quit(1); }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  mongo-data: